<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡vamos! Practice Spanish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FF; --surface:#FFFFFF; --ink:#0E1A4B; --ink2:#4B5788; --line:#D8DFF5;
  --brand:#2347D6; --onbrand:#FFFFFF; --hero:#2347D6; --sun:#FFC42E; --onsun:#2B1E00;
  --good:#168F60; --goodbg:#DDF6EA; --bad:#CF3558; --badbg:#FDE3E9; --selbg:#E8EDFF;
  --tile:rgba(35,71,214,.14); --tile-on:rgba(255,255,255,.16);
  --disc-s:90%; --disc-l:91%; --fill-l:48%;
  --shadow:0 1px 0 rgba(14,26,75,.04),0 14px 30px -14px rgba(14,26,75,.28);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1233; --surface:#141D4A; --ink:#EEF1FF; --ink2:#A9B4E6; --line:#2A3670;
    --brand:#7C99FF; --onbrand:#0B1233; --hero:#2B44B8; --sun:#FFC42E; --onsun:#2B1E00;
    --good:#4ADE9C; --goodbg:#10382D; --bad:#FF7A93; --badbg:#431A2B; --selbg:#1F2C6E;
    --tile:rgba(124,153,255,.16); --tile-on:rgba(255,255,255,.14);
    --disc-s:45%; --disc-l:26%; --fill-l:66%;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 30px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1233; --surface:#141D4A; --ink:#EEF1FF; --ink2:#A9B4E6; --line:#2A3670;
  --brand:#7C99FF; --onbrand:#0B1233; --hero:#2B44B8; --sun:#FFC42E; --onsun:#2B1E00;
  --good:#4ADE9C; --goodbg:#10382D; --bad:#FF7A93; --badbg:#431A2B; --selbg:#1F2C6E;
  --tile:rgba(124,153,255,.16); --tile-on:rgba(255,255,255,.14);
  --disc-s:45%; --disc-l:26%; --fill-l:66%;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;position:relative;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.05}
p{margin:0}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:8px}

.band{position:absolute;top:0;left:0;right:0;height:560px;pointer-events:none;z-index:0;
  background-image:
   radial-gradient(circle at 0 0,transparent 0 30px,var(--tile) 30px 32px,transparent 32px),
   radial-gradient(circle at 100% 0,transparent 0 30px,var(--tile) 30px 32px,transparent 32px),
   radial-gradient(circle at 0 100%,transparent 0 30px,var(--tile) 30px 32px,transparent 32px),
   radial-gradient(circle at 100% 100%,transparent 0 30px,var(--tile) 30px 32px,transparent 32px);
  background-size:64px 64px;
  -webkit-mask-image:linear-gradient(to bottom,#000 10%,transparent 95%);
  mask-image:linear-gradient(to bottom,#000 10%,transparent 95%)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 0 6px}
.logo{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.03em;color:var(--brand);background:none;border:0;padding:4px 0;cursor:pointer}
main{padding-bottom:72px}

/* segmented control */
.seg{position:relative;display:inline-grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:4px;isolation:isolate}
.seg button{position:relative;z-index:1;font-weight:700;font-size:.92rem;background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--ink2);border-radius:10px;transition:color .25s;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--onbrand)}
.seg .thumb{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/2);background:var(--brand);border-radius:10px;transform:translateX(calc(var(--pos,0)*100%));transition:transform .45s cubic-bezier(.3,1.25,.5,1)}

/* buttons */
.btn{font-weight:700;font-size:1rem;border-radius:14px;padding:14px 22px;border:2px solid transparent;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--onbrand)}
.btn.primary:hover{box-shadow:0 8px 20px -8px var(--brand)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--brand)}
.btn.sun{background:var(--sun);color:var(--onsun)}
.btn.sun:hover{box-shadow:0 8px 22px -8px var(--sun)}
.iconbtn,.spk{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .15s,border-color .2s}
.iconbtn:hover,.spk:hover{border-color:var(--brand)}
.spk:active,.iconbtn:active{transform:scale(.92)}

/* screens */
.screen{animation:screen-in .45s cubic-bezier(.2,.8,.2,1)}
.screen.home{animation:none}
@keyframes screen-in{from{opacity:0;transform:translateY(10px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes tilt-in{from{opacity:0;transform:perspective(900px) rotateY(-26deg) translateX(34px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes matched{to{transform:scale(.95);opacity:.5}}

/* home */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center;padding:34px 0 8px}
.hero h1{font-size:clamp(2.2rem,5.4vw,3.7rem);max-width:15ch}
.lead{color:var(--ink2);max-width:46ch;margin-top:16px}
.lead.center{margin-left:auto;margin-right:auto}
.stats{display:flex;flex-wrap:wrap;gap:8px 26px;margin:22px 0 24px;color:var(--ink2);font-size:.95rem}
.stats b{font-family:var(--display);font-size:1.6rem;color:var(--ink);margin-right:4px}
.wordcard{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:30px;min-height:290px;display:grid;place-items:center;text-align:center;padding:28px;box-shadow:var(--shadow);animation:tilt-in .8s cubic-bezier(.2,.8,.2,1) .1s backwards}
.wordcard::before{content:"";position:absolute;inset:0;
  background-image:
   radial-gradient(circle at 0 0,transparent 0 30px,var(--tile-on) 30px 32px,transparent 32px),
   radial-gradient(circle at 100% 0,transparent 0 30px,var(--tile-on) 30px 32px,transparent 32px),
   radial-gradient(circle at 0 100%,transparent 0 30px,var(--tile-on) 30px 32px,transparent 32px),
   radial-gradient(circle at 100% 100%,transparent 0 30px,var(--tile-on) 30px 32px,transparent 32px);
  background-size:64px 64px}
.wc-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.wc-e{font-size:56px;line-height:1;min-height:56px}
.wc-es{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6vw,3.3rem);letter-spacing:-.02em;line-height:1.05}
.wc-n{color:var(--sun);font-weight:700;font-size:1.2rem}
h2.sec{font-size:1.5rem;margin:42px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:16px;background:var(--surface);border:2px solid var(--line);border-radius:20px;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.3,.5,1),border-color .2s,box-shadow .25s;animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*38ms + 200ms)}
.tile:hover{transform:translateY(-4px);border-color:hsl(var(--h) 70% 55%);box-shadow:var(--shadow)}
.tile:active{transform:scale(.98)}
.disc{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:26px;background:hsl(var(--h) var(--disc-s) var(--disc-l));margin-bottom:14px;line-height:1}
.disc.big{width:76px;height:76px;font-size:40px;border-radius:22px;margin:0;flex:none}
.tname{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em}
.tmeta{font-size:.88rem;color:var(--ink2)}
.bar{display:block;height:6px;border-radius:99px;background:var(--line);width:100%;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:inherit;background:hsl(var(--h) 75% var(--fill-l));animation:grow .9s cubic-bezier(.2,.8,.2,1) .35s backwards}

/* topic */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink2);font-weight:700;cursor:pointer;padding:10px 0;font-size:1rem}
.back:hover{color:var(--ink)}
.thead{display:flex;gap:18px;align-items:center;margin:10px 0 24px}
.thead h1{font-size:clamp(1.9rem,5vw,2.7rem)}
.sub{color:var(--ink2);margin-top:4px}
.dirrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:20px;font-weight:700;color:var(--ink2)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;padding:18px;background:var(--surface);border:2px solid var(--line);border-radius:20px;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.3,.5,1),border-color .2s,box-shadow .25s}
.mode:hover{transform:translateY(-3px);border-color:hsl(var(--h) 70% 55%);box-shadow:var(--shadow)}
.mode:active{transform:scale(.98)}
.mi{font-size:30px;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:hsl(var(--h) var(--disc-s) var(--disc-l));flex:none}
.mode strong{display:block;font-family:var(--display);font-size:1.15rem}
.mode small{display:block;color:var(--ink2);font-size:.9rem;line-height:1.3;margin-top:2px}
.wordlist{margin-top:34px}
.wordlist summary{font-family:var(--display);font-weight:700;font-size:1.3rem;cursor:pointer;margin-bottom:14px}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.we{width:34px;text-align:center;font-size:22px}
.wt{flex:1;min-width:0}
.wt b{display:block;font-weight:700}
.wt small{color:var(--ink2);font-size:.9rem}
.wrow .spk{width:38px;height:38px}

/* sessions */
.sess{max-width:680px;margin:0 auto}
.sess-top{display:flex;align-items:center;gap:14px;padding-top:12px}
.pbar{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:inherit;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pcount{font-weight:700;color:var(--ink2);min-width:3.2ch;text-align:right;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:22px;flex-wrap:wrap}

.cardwrap{perspective:1400px;max-width:460px;margin:30px auto 0;aspect-ratio:4/3}
.card{display:block;width:100%;height:100%;position:relative;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.2,.4,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.front{background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow)}
.back{background:var(--hero);color:#fff;transform:rotateY(180deg);box-shadow:var(--shadow)}
.face .e{font-size:58px;line-height:1}
.face .word{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,6vw,2.7rem);line-height:1.1;letter-spacing:-.02em}
.face .small{font-size:.85rem;color:var(--ink2)}

.qcard{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:28px 20px;text-align:center;margin:28px 0 18px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--shadow);animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards}
.qcard .e{font-size:50px;line-height:1}
.qtext{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,6vw,2.5rem);line-height:1.1;letter-spacing:-.02em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:16px 18px;border:2px solid var(--line);background:var(--surface);border-radius:18px;font-weight:600;font-size:1.05rem;cursor:pointer;transition:transform .2s,border-color .2s,background .2s;animation:rise .4s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--k)*55ms + 80ms);color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--brand);transform:translateY(-2px)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt kbd{font:inherit;font-size:.78rem;font-weight:700;min-width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--selbg);color:var(--ink2);flex:none}
.opt.right{background:var(--goodbg);border-color:var(--good);animation:pop .45s ease}
.opt.wrong{background:var(--badbg);border-color:var(--bad);animation:shake .45s ease}
.fb{margin-top:18px;padding:14px 16px;border-radius:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-left:6px solid var(--line);background:var(--surface);animation:rise .35s cubic-bezier(.2,.8,.2,1) backwards}
.fb.good{background:var(--goodbg);border-left-color:var(--good)}
.fb.bad{background:var(--badbg);border-left-color:var(--bad)}
.fbtxt{display:flex;flex-direction:column;gap:2px}
.fbtxt span{color:var(--ink2)}
.fbtxt b{color:var(--ink)}
.fbbtns{display:flex;align-items:center;gap:10px}
.fb .btn{padding:10px 18px}

.tinput{width:100%;font:inherit;font-size:1.3rem;font-weight:600;padding:16px 18px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--ink);transition:border-color .2s}
.tinput:focus{outline:none;border-color:var(--brand)}
.tinput.shake{animation:shake .45s ease;border-color:var(--bad)}
.tinput.okk{border-color:var(--good)}
.specials{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0;min-height:42px}
.chip{font-weight:700;font-size:1rem;min-width:42px;padding:8px 10px;border-radius:11px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--brand)}

.mmeta{text-align:center;color:var(--ink2);margin-top:18px;font-weight:600}
.mmeta b{color:var(--ink)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 0}
.mcol{display:flex;flex-direction:column;gap:12px}
.mt{padding:16px 12px;min-height:66px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:1.02rem;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.3,.5,1),border-color .2s,background .2s}
.mt:hover:not(:disabled){border-color:var(--brand)}
.mt.sel{border-color:var(--brand);background:var(--selbg);transform:scale(1.04)}
.mt.no{animation:shake .45s ease;border-color:var(--bad);background:var(--badbg)}
.mt.ok{border-color:var(--good);background:var(--goodbg);animation:matched .5s ease forwards;cursor:default;color:var(--ink)}

.resbox{text-align:center;padding-top:34px;max-width:520px;margin:0 auto}
.ringwrap{position:relative;width:190px;height:190px;margin:0 auto 24px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--line);stroke-width:10}
.fillc{fill:none;stroke:var(--brand);stroke-width:10;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.rtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rtxt b{font-family:var(--display);font-size:3rem;line-height:1}
.rtxt span{color:var(--ink2);font-weight:600}
.resbox h1{font-size:2.4rem}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:26px}
  .wordcard{min-height:230px}
  .opts{grid-template-columns:1fr}
  .seg button{padding:10px 10px;font-size:.88rem}
  .top{padding-top:14px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="band" aria-hidden="true"></div>
<div class="wrap">
  <header class="top" id="top"></header>
  <main id="app"></main>
</div>

const uniqueSample = (arr, n) => {
  const out = [];
  for (const w of shuffle(arr.slice())) {
    if (out.every(o => o.es !== w.es && o.en !== w.en && o.no !== w.no)) out.push(w);
    if (out.length >= n) break;
  }
  return out;
};

function award(w, xp, mark = true) {
  if (mark) store.learned[w.id] = true;
  store.xp += xp;
  const d = today();
  if (store.last !== d) { store.streak = store.last === yesterday() ? store.streak + 1 : 1; store.last = d; }

}

/* ---------- Answer checking ---------- */
const strip = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function norm(s) {
  s = s.toLowerCase().replace(/\(.*?\)/g, ' ').replace(/['’]/g, '').replace(/[¿?¡!.,;:]/g, ' ').replace(/\s+/g, ' ').trim();
  return s.replace(/^(el|la|los|las|un|una|the|a|an|to|å) /, '');
}
function grade(inp, ans) {
  const x = norm(inp);
  if (!x) return 'no';
  const vs = ans.split('/').map(norm);
  if (vs.includes(x)) return 'ok';
  const y = strip(x);
  if (vs.some(v => strip(v) === y)) return 'accent';
  return 'no';
}

/* ---------- Audio ---------- */
let voice = null;
const hasTTS = 'speechSynthesis' in window;
function pickVoice() { const vs = speechSynthesis.getVoices(); voice = vs.find(v => /^es[-_]ES/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null; }
if (hasTTS) { try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {} }
function speak(txt) {
  if (!hasTTS || !txt) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = 'es-ES'; if (voice) u.voice = voice; u.rate = .9; speechSynthesis.speak(u); } catch (e) {}
}

function seg(name, opts, cur, aria) {
  const idx = Math.max(0, opts.findIndex(o => o.v === cur));
  return `<div class="seg ${name}" role="group" aria-label="${esc(aria || name)}" style="--pos:${idx}"><span class="thumb"></span>${opts.map(o => `<button type="button" data-v="${o.v}" aria-pressed="${o.v === cur}">${o.label}</button>`).join('')}</div>`;
}
function bindSeg(el, onChange) {
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const btns = [...el.querySelectorAll('button')];
    btns.forEach(x => x.setAttribute('aria-pressed', x === b));
    el.style.setProperty('--pos', btns.indexOf(b));
    onChange(b.dataset.v);
  });
}

  <button class="back" id="back">${backSvg}<span>${t('back')}</span></button>
  <div class="thead" style="--h:${tp.h}"><span class="disc big">${tp.icon}</span><div><h1>${tp[store.lang]}</h1><p class="sub">${words ? t('progress', done, words.length) : t('mixDesc')}</p></div></div>
  <div class="dirrow"><span>${t('direction')}</span>${seg('dir', [{v:'toEs', label:`${L} → Español`}, {v:'fromEs', label:`Español → ${L}`}], store.dir, t('direction'))}</div>
  <div class="modes" style="--h:${tp.h}">${modes.map(([m, ic]) => `<button class="mode" data-m="${m}"><span class="mi">${ic}</span><span><strong>${t(m)}</strong><small>${t(m + 'D')}</small></span></button>`).join('')}</div>
  ${words ? `<details class="wordlist" open><summary>${t('wordList')}</summary><div class="wl">${words.map(w => `<div class="wrow"><span class="we">${w.e}</span><span class="wt"><b>${fmt(w.es)}</b><small>${fmt(w[store.lang])}</small></span>${spk(w.es)}</div>`).join('')}</div></details>` : ''}`, 'topic');
  $('#back').addEventListener('click', () => go({name:'home'}));
  bindSeg($('.seg.dir'), v => { store.dir = v; save(); });
  $('.modes').addEventListener('click', e => { const b = e.target.closest('.mode'); if (b) go({name:b.dataset.m === 'type' ? 'type' : b.dataset.m, id}); });
}

/* ---------- Results ---------- */
function results({id, ratio, big, small, line}) {
  if (cleanup) { cleanup(); cleanup = null; }
  keyHandler = null;
  const mode = view.name;
  view = {name:'results', id};
  ratio = Math.max(0, Math.min(1, ratio || 0));
  const msg = ratio >= .9 ? t('great') : ratio >= .6 ? t('good') : t('keep');
  frame(`<div class="resbox">
    <div class="ringwrap"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="54"/><circle class="fillc" id="ring" cx="60" cy="60" r="54"/></svg><div class="rtxt"><b>${big}</b><span>${small}</span></div></div>
    <h1>${msg}</h1><p class="lead center">${line}</p>
    <div class="actions"><button class="btn ghost" id="totopic">${t('toTopic')}</button><button class="btn primary" id="redo">${t('redo')}</button></div></div>`);
  requestAnimationFrame(() => requestAnimationFrame(() => { $('#ring').style.strokeDashoffset = 339.3 * (1 - ratio); }));
  $('#totopic').addEventListener('click', () => go({name:'topic', id}));
  $('#redo').addEventListener('click', () => go({name:mode, id}));
  window.scrollTo(0, 0);
}

/* ---------- Flashcards ---------- */
function flash(id) {
  const deck = shuffle(deckFor(id)); const total = deck.length;
  const missed = new Set(); let known = 0, busy = false;
  frame(`${sessTop()}
  <div class="cardwrap" id="wrap"><button class="card" id="card" aria-label="${t('tapFlip')}"><span class="face front" id="front"></span><span class="face back" id="back"></span></button></div>
  <div class="actions"><button class="btn ghost" id="again">${t('again')}</button>${hasTTS ? `<button class="spk" id="say" aria-label="${t('listen')}">${speakSvg}</button>` : ''}<button class="btn primary" id="know">${t('know')}</button></div>`, 'sess');
  bindQuit(id);
  const card = $('#card'), wrap = $('#wrap');
  function setCard() {
    const w = deck[0];
    card.style.transition = 'none'; card.classList.remove('flipped'); void card.offsetWidth; card.style.transition = '';
    $('#front').innerHTML = `${hint(w) ? `<span class="e">${hint(w)}</span>` : ''}<span class="word">${fmt(qOf(w))}</span><span class="small">${t('tapFlip')}</span>`;
    $('#back').innerHTML = `<span class="word">${fmt(aOf(w))}</span>`;
    setProgress(known / total, `${known}/${total}`);
  }
  const flip = () => { if (!busy) card.classList.toggle('flipped'); };
  async function answer(knew) {
    if (busy || !deck.length) return;
    busy = true;
    const w = deck.shift();
    if (knew) { known++; award(w, 5); } else { missed.add(w.id); deck.push(w); }
    if (!RM) {
      try { await wrap.animate([{transform:'none', opacity:1}, {transform:`translateX(${knew ? '' : '-'}120%) rotate(${knew ? 10 : -10}deg)`, opacity:0}], {duration:360, easing:'cubic-bezier(.5,0,.8,.4)', fill:'forwards'}).finished; } catch (e) {}
    }
    if (!deck.length) { setProgress(1, `${total}/${total}`); const s = total - missed.size; results({id, ratio:s / total, big:s, small:`/ ${total}`, line:t('flashLine', s, total)}); return; }
    setCard();
    if (!RM) wrap.animate([{transform:'scale(.92) translateY(14px)', opacity:0}, {transform:'none', opacity:1}], {duration:440, easing:'cubic-bezier(.2,.8,.2,1)', fill:'forwards'});
    busy = false;
  }
  setCard();
  card.addEventListener('click', flip);
  $('#again').addEventListener('click', () => answer(false));
  $('#know').addEventListener('click', () => answer(true));
  const say = $('#say'); if (say) say.addEventListener('click', () => speak(deck[0] && deck[0].es));
  keyHandler = e => {
    if (e.key === 'ArrowLeft') answer(false);
    else if (e.key === 'ArrowRight') answer(true);
    else if ((e.key === ' ' || e.key === 'Enter') && e.target === document.body) { e.preventDefault(); flip(); }
  };
}

/* ---------- Quiz ---------- */
function quiz(id) {
  const pool = id === 'mix' ? ALL : topicOf(id).words;
  const qs = shuffle(deckFor(id)).slice(0, 10);
  let i = 0, score = 0, locked = false, timer = null, opts = [];
  frame(`${sessTop()}<div id="qbox"></div>`, 'sess');
  bindQuit(id);
  cleanup = () => clearTimeout(timer);
  const next = () => {
    clearTimeout(timer); i++;
    if (i >= qs.length) { setProgress(1, `${qs.length}/${qs.length}`); results({id, ratio:score / qs.length, big:score, small:`/ ${qs.length}`, line:t('quizLine', score, qs.length)}); }
    else ask();
  };
  function ask() {
    locked = false;
    const w = qs[i];
    const bad = shuffle(pool.filter(d => d.es !== w.es && d.en !== w.en && d.no !== w.no));
    const seen = new Set([aOf(w)]); opts = [w];
    for (const d of bad) { const a = aOf(d); if (!seen.has(a)) { seen.add(a); opts.push(d); } if (opts.length === 4) break; }
    shuffle(opts);
    setProgress(i / qs.length, `${i + 1}/${qs.length}`);
    $('#qbox').innerHTML = `
      <div class="qcard">${hint(w) ? `<span class="e">${hint(w)}</span>` : ''}<div class="qtext">${fmt(qOf(w))}</div>${store.dir === 'fromEs' ? spk(w.es) : ''}</div>
      <div class="opts">${opts.map((o, k) => `<button class="opt" style="--k:${k}" data-k="${k}"><kbd>${k + 1}</kbd><span>${fmt(aOf(o))}</span></button>`).join('')}</div>
      <div id="fbox" aria-live="polite"></div>`;
  }
  function pick(k) {
    if (locked) return; locked = true;
    const w = qs[i], ok = opts[k].id === w.id;
    const btns = [...app.querySelectorAll('.opt')];
    btns.forEach((b, j) => { b.disabled = true; if (opts[j].id === w.id) b.classList.add('right'); });
    if (ok) { score++; award(w, 10); } else btns[k].classList.add('wrong');
    $('#fbox').innerHTML = `<div class="fb ${ok ? 'good' : 'bad'}"><div class="fbtxt"><strong>${ok ? t('correct') : t('notQuite')}</strong><span><b>${fmt(w.es)}</b> = ${fmt(w[store.lang])}</span></div><div class="fbbtns">${spk(w.es)}<button class="btn primary" id="nextq">${t('next')}</button></div></div>`;
    $('#nextq').addEventListener('click', next);
    if (ok) timer = setTimeout(next, 1500);
  }
  $('#qbox').addEventListener('click', e => { const b = e.target.closest('.opt'); if (b) pick(+b.dataset.k); });
  ask();
  keyHandler = e => {
    if (/^[1-4]$/.test(e.key) && opts[+e.key - 1]) pick(+e.key - 1);
    else if (e.key === 'Enter' && locked && e.target === document.body) next();
  };
}

/* ---------- Type it ---------- */
function typing(id) {
  const qs = shuffle(deckFor(id)).slice(0, 10);
  let i = 0, score = 0, done = false;
  frame(`${sessTop()}<div id="tbox"></div>`, 'sess');
  bindQuit(id);
  const next = () => {
    i++;
    if (i >= qs.length) { setProgress(1, `${qs.length}/${qs.length}`); results({id, ratio:score / qs.length, big:score, small:`/ ${qs.length}`, line:t('quizLine', score, qs.length)}); }
    else ask();
  };
  function check(skipped) {
    if (done) return;
    const w = qs[i], ans = aOf(w), inp = $('#tin');
    const r = skipped ? 'no' : grade(inp.value, ans);
    done = true; inp.readOnly = true;
    if (r === 'no') { inp.classList.add('shake'); } else { inp.classList.add('okk'); score++; award(w, 10); }
    $('#fbox').innerHTML = `<div class="fb ${r === 'no' ? 'bad' : 'good'}"><div class="fbtxt"><strong>${r === 'ok' ? t('correct') : r === 'accent' ? t('accentNote') : t('notQuite')}</strong><span><b>${fmt(w.es)}</b> = ${fmt(w[store.lang])}</span></div>${spk(w.es)}</div>`;
    $('#check').textContent = t('next');
    $('#skip').hidden = true;
  }
  function ask() {
    done = false;
    const w = qs[i], toEs = store.dir === 'toEs';
    const sp = toEs ? ['á','é','í','ó','ú','ñ','ü','¿','¡'] : (store.lang === 'no' ? ['æ','ø','å'] : []);
    setProgress(i / qs.length, `${i + 1}/${qs.length}`);
    $('#tbox').innerHTML = `
      <div class="qcard">${hint(w) ? `<span class="e">${hint(w)}</span>` : ''}<div class="qtext">${fmt(qOf(w))}</div>${!toEs ? spk(w.es) : ''}</div>
      <input class="tinput" id="tin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${t('typeHere')}" aria-label="${t('typeHere')}" lang="${toEs ? 'es' : (store.lang === 'no' ? 'nb' : 'en')}">
      <div class="specials">${sp.map(c => `<button type="button" class="chip" data-c="${c}">${c}</button>`).join('')}</div>
      <div id="fbox" aria-live="polite"></div>
      <div class="actions"><button class="btn ghost" id="skip">${t('skip')}</button><button class="btn primary" id="check">${t('check')}</button></div>`;
    const inp = $('#tin'); inp.focus();
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); done ? next() : check(false); } });
    $('#check').addEventListener('click', () => done ? next() : check(false));
    $('#skip').addEventListener('click', () => check(true));
    $('.specials').addEventListener('mousedown', e => e.preventDefault());
    $('.specials').addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b || done) return;
      inp.setRangeText(b.dataset.c, inp.selectionStart, inp.selectionEnd, 'end'); inp.focus();
    });
  }
  ask();
  keyHandler = e => { if (e.key === 'Enter' && done && e.target === document.body) next(); };
}

/* ---------- Match pairs ---------- */
function matchGame(id) {
  const ws = uniqueSample(deckFor(id), 6);
  const n = ws.length;
  const Ls = shuffle(ws.slice()), Rs = shuffle(ws.slice());
  let sel = null, locked = false, moves = 0, matched = 0;
  const wrongSet = new Set(); const t0 = Date.now();
  const tile = side => w => `<button class="mt" data-side="${side}" data-id="${w.id}">${fmt(side === 'L' ? qOf(w) : aOf(w))}</button>`;
  frame(`${sessTop()}<div class="mmeta">${t('moves')}: <b id="mv">0</b></div>
    <div class="mgrid" id="mgrid"><div class="mcol">${Ls.map(tile('L')).join('')}</div><div class="mcol">${Rs.map(tile('R')).join('')}</div></div>`, 'sess');
  bindQuit(id);
  setProgress(0, `0/${n}`);
  cleanup = () => {};
  $('#mgrid').addEventListener('click', e => {
    const b = e.target.closest('.mt');
    if (!b || locked || b.classList.contains('ok')) return;
    if (!sel) { sel = b; b.classList.add('sel'); return; }
    if (sel === b) { b.classList.remove('sel'); sel = null; return; }
    if (sel.dataset.side === b.dataset.side) { sel.classList.remove('sel'); sel = b; b.classList.add('sel'); return; }
    moves++; $('#mv').textContent = moves;
    const a = sel; sel = null;
    if (a.dataset.id === b.dataset.id) {
      [a, b].forEach(x => { x.classList.remove('sel'); x.classList.add('ok'); x.disabled = true; });
      matched++;
      const w = BY_ID[b.dataset.id], clean = !wrongSet.has(w.id);
      award(w, clean ? 10 : 3, clean);
      setProgress(matched / n, `${matched}/${n}`);
      if (matched === n) {
        locked = true;
        const secs = Math.round((Date.now() - t0) / 1000);
        setTimeout(() => results({id, ratio:n / moves, big:moves, small:t('movesWord'), line:t('matchLine', moves, secs)}), 750);
      }
    } else {
      locked = true; wrongSet.add(a.dataset.id); wrongSet.add(b.dataset.id);
      [a, b].forEach(x => { x.classList.remove('sel'); x.classList.add('no'); });
      setTimeout(() => { [a, b].forEach(x => x.classList.remove('no')); locked = false; }, 480);
    }
  });
}

go({name:'home'}, true);
})();
</script>
